[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operange"
version = "0.1.0"
description = "Process-engineering sensitivity and robustness DSL with portable evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
cvxpy = ["cvxpy>=1.5"]

[dependency-groups]
dev = ["bandit>=1.9.4", "pytest>=8.0", "ruff>=0.8", "twine>=6.1"]
docs = ["furo>=2024.8.6", "myst-parser>=4.0", "sphinx>=7.4"]

[project.urls]
Homepage = "https://github.com/nahuaque/operange"
Repository = "https://github.com/nahuaque/operange"
Documentation = "https://nahuaque.github.io/operange/"
Issues = "https://github.com/nahuaque/operange/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["operange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
