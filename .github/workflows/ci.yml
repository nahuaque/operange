name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Override .python-version so uv uses this job's selected interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q
      - name: Test optional CVXPY support
        run: |
          uv sync --locked --group dev --extra cvxpy
          uv run --locked --extra cvxpy pytest -q
      - name: Test optional IDAES support
        run: |
          uv sync --locked --group dev --extra cvxpy --extra idaes
          uv run --locked --extra cvxpy --extra idaes pytest -q tests/test_idaes.py tests/test_idaes_workflow.py tests/test_idaes_optional.py tests/test_parmest.py tests/test_parmest_optional.py tests/test_parmest_uncertainty.py tests/test_idaes_shared_controls.py tests/test_idaes_shared_optional.py tests/test_calibration_diagnostics.py tests/test_calibration_quality_optional.py
      - name: Build distributions
        run: |
          uv build
          uv run --locked twine check dist/*
      - name: Verify the installed wheel without repository imports
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/operange-consumer-venv"
          uv pip install --python "$RUNNER_TEMP/operange-consumer-venv/bin/python" dist/*.whl
          mkdir -p "$RUNNER_TEMP/operange-consumer"
          cp examples/steam_header.py examples/linear_dispatch.py examples/failure_distance.py examples/engineering_changes.py examples/frozen_controllers.py examples/storage_replay.py examples/startup.py examples/pinch.py examples/uncertainty_compositions.py examples/measurement_uncertainty.py examples/operating_limits.py examples/equipment_network.py examples/dispatch_sensitivity.py tests/acceptance/wheel.py tests/fixtures/prototype_result_v1.json "$RUNNER_TEMP/operange-consumer/"
          cp tests/fixtures/calibration_result_v1.json tests/fixtures/calibration_bootstrap_v1.json "$RUNNER_TEMP/operange-consumer/"
          cd "$RUNNER_TEMP/operange-consumer"
          "$RUNNER_TEMP/operange-consumer-venv/bin/python" -I wheel.py
      - name: Verify optional CVXPY support from the installed wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/operange-consumer-venv/bin/python" "${wheels[0]}[cvxpy]"
          cp tests/acceptance/cvxpy_wheel.py "$RUNNER_TEMP/operange-consumer/"
          cd "$RUNNER_TEMP/operange-consumer"
          "$RUNNER_TEMP/operange-consumer-venv/bin/python" -I cvxpy_wheel.py
      - name: Verify optional IDAES support from the installed wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/operange-consumer-venv/bin/python" "${wheels[0]}[idaes]"
          cp tests/acceptance/idaes_wheel.py examples/idaes_flowsheet.py "$RUNNER_TEMP/operange-consumer/"
          cd "$RUNNER_TEMP/operange-consumer"
          "$RUNNER_TEMP/operange-consumer-venv/bin/python" -I idaes_wheel.py
  idaes-reconciliation:
    name: IDAES nonlinear studies / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra idaes
      - name: Install IDAES solver binaries
        run: |
          uv run --locked --extra idaes idaes get-extensions --distro ubuntu2204
          echo "$HOME/.idaes/bin" >> "$GITHUB_PATH"
      - name: Require Ipopt and exercise upstream units, diagnostics and parmest
        run: |
          uv run --locked --extra idaes python -c "import pyomo.environ as p; raise SystemExit(not p.SolverFactory('ipopt').available(False))"
          uv run --locked --extra idaes pytest -q tests/test_idaes.py tests/test_idaes_workflow.py tests/test_parmest.py tests/test_parmest_optional.py tests/test_parmest_uncertainty.py tests/test_idaes_shared_controls.py tests/test_idaes_shared_optional.py tests/test_calibration_diagnostics.py tests/test_calibration_quality_optional.py
          uv run --locked --extra idaes python examples/idaes_flowsheet.py --reconcile
      - name: Exercise heat-exchanger calibration and re-audit from an installed wheel
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/idaes-wheel-venv"
          wheels=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/idaes-wheel-venv/bin/python" "${wheels[0]}[idaes]"
          mkdir -p "$RUNNER_TEMP/idaes-wheel-consumer"
          cp tests/acceptance/idaes_heat_exchanger_wheel.py examples/idaes_heat_exchanger.py tests/acceptance/idaes_uncertainty_wheel.py examples/idaes_uncertainty.py tests/acceptance/calibration_credibility_wheel.py examples/calibration_credibility.py "$RUNNER_TEMP/idaes-wheel-consumer/"
          cd "$RUNNER_TEMP/idaes-wheel-consumer"
          "$RUNNER_TEMP/idaes-wheel-venv/bin/python" -I idaes_heat_exchanger_wheel.py
          "$RUNNER_TEMP/idaes-wheel-venv/bin/python" -I idaes_uncertainty_wheel.py
          "$RUNNER_TEMP/idaes-wheel-venv/bin/python" -I calibration_credibility_wheel.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --group docs --extra cvxpy
      - run: uv run --locked ruff check .
      - run: uv run --locked bandit -q -r src examples tests
      - run: uv run --locked --extra cvxpy pytest -q
      - run: uv run --locked --group docs sphinx-build -W -b html docs docs/_build/html
